name: build
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      allow-security-alert:
        required: false
        type: boolean
        default: false
      alpha-streams:
        required: false
        type: string
        default: '[]'
    secrets:
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true
      CI_TOKEN:
        description: Keys the encrypted run license that the rows activate from.
        required: false
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    continue-on-error: ${{ contains(fromJSON(inputs.alpha-streams), matrix.unity-version) }}
    runs-on: ${{ matrix.os }}
    # a hung editor, licensing call or Xcode archive must not hold the matrix
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ''
      EXPORT_OPTION: ''
      BUILD_DIRECTORY: ''
      UNITY_PROJECT_PATH: ${{ github.workspace }}/UnityProject
    steps:
      - uses: actions/checkout@v7
      - uses: buildalon/unity-setup@v3
        timeout-minutes: 30
        with:
          version-file: 'None'
          build-targets: ${{ matrix.build-target }}
          unity-version: ${{ matrix.unity-version }}
          allow-security-alert: ${{ inputs.allow-security-alert }}
          # the streams include the beta and alpha, which only have prereleases until they ship
          channels: f,b,a
      - name: Set Build Args
        env:
          MATRIX_UNITY_VERSION: ${{ matrix.unity-version }}
          MATRIX_XCODE_VERSION: ${{ matrix.xcode-version }}
          MATRIX_BUILD_TARGET: ${{ matrix.build-target }}
        run: |
          set -euo pipefail
          # Read version from package.json instead of git tags
          version="$(jq -r .version "${GITHUB_WORKSPACE}/package.json")"

          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version from package.json: ${version}"
          else
            echo "Version: ${version} is not a valid version string"
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

          # Only set export option to app-store-connect if unity-version is 6000.2.x AND xcode-version is 16.2
          if [[ "${MATRIX_UNITY_VERSION}" == "6000.2.x" && "${MATRIX_XCODE_VERSION}" == "16.2" ]]; then
            echo "EXPORT_OPTION=app-store-connect" >> "${GITHUB_ENV}"
          elif [[ "${MATRIX_BUILD_TARGET}" == "StandaloneOSX" ]]; then
            # the stream matrix lists 2022.3, the legacy run 2022.x
            if [[ "${MATRIX_UNITY_VERSION}" == 2022* ]]; then
              echo "EXPORT_OPTION=steam" >> "${GITHUB_ENV}"
            else
              echo "EXPORT_OPTION=developer-id" >> "${GITHUB_ENV}"
            fi
          else
            echo "EXPORT_OPTION=development" >> "${GITHUB_ENV}"
          fi

          # set BUILD_DIRECTORY to a path in the root of the workspace named ./Builds/<build-target>/
          build_directory="${GITHUB_WORKSPACE}/Builds/${MATRIX_BUILD_TARGET}"
          echo "Creating build directory at ${build_directory}"
          mkdir -p "${build_directory}"
          echo "BUILD_DIRECTORY=${build_directory}" >> "${GITHUB_ENV}"
      # macOS runners all report the same machine identity to Unity, so the license the license job activated once for
      # this run serves every row; it arrives as an encrypted artifact and is never returned. Without it, or when it no
      # longer fits this machine, the row activates with the account.
      - name: Download run license
        id: download-run-license
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: unity-license-${{ runner.os }}
          path: ${{ runner.temp }}/unity-license
      - name: Decrypt run license
        id: run-license
        if: ${{ steps.download-run-license.outcome == 'success' }}
        continue-on-error: true
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/unity-license"
          license="${dir}/Unity_lic.ulf"
          # the key never reaches a command line: openssl reads it from the environment
          export LICENSE_KEY="${CI_TOKEN}:${GITHUB_RUN_ID}"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "${dir}/unity-license.enc" -out "${license}" -pass env:LICENSE_KEY; then
            echo 'Could not decrypt the run license' >&2
            exit 1
          fi
          echo "path=${license}" >> "${GITHUB_OUTPUT}"
      # activates from UNITY_LICENSE before signing in; the post step skips the return on GitHub-hosted macOS
      - uses: buildalon/activate-unity-license@v3
        env:
          UNITY_LICENSE: ${{ steps.run-license.outputs.path }}
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Remove run license
        if: ${{ always() && steps.download-run-license.outcome == 'success' }}
        run: rm -rf "${RUNNER_TEMP}/unity-license"
      - uses: buildalon/create-unity-project@v4
        name: Create Test Project
        with:
          project-name: UnityProject
      - name: Add Build Pipeline Package
        working-directory: ${{ env.UNITY_PROJECT_PATH }}
        run: |
          npm install -g openupm-cli
          openupm add com.virtualmaker.buildalon
      - uses: buildalon/unity-action@v4
        name: ${{ matrix.build-target }}-Validate
        with:
          build-target: ${{ matrix.build-target }}
          log-name: ${{ matrix.build-target }}-Validate
          args: -quit -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.ValidateProject -importTMProEssentialsAsset
      - uses: buildalon/unity-action@v4
        name: ${{ matrix.build-target }}-Build
        timeout-minutes: 30
        with:
          build-target: ${{ matrix.build-target }}
          log-name: ${{ matrix.build-target }}-Build
          args: -quit -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild -sceneList Assets/Scenes/SampleScene.unity -export -enableAppleAutomaticSigning -bundleIdentifier com.test.buildalon.xcode -versionName ${{ env.VERSION }} -buildOutputDirectory ${{ env.BUILD_DIRECTORY }}
      - name: Update Info.Plist with encryption compliance
        run: |
          set -euo pipefail

          if [ -z "${BUILD_DIRECTORY}" ]; then
            echo "env.BUILD_DIRECTORY is not set!"
            exit 1
          fi

          # recursively list build output files
          echo "::group::Build Output Directory: ${BUILD_DIRECTORY}/com.test.buildalon.xcode"
          ls -alR "${BUILD_DIRECTORY}/com.test.buildalon.xcode"
          echo "::endgroup::"

          # find the Info.plist file in the build directory
          # MacOSStandalone Info.plist path: <build directory>/com.test.buildalon.xcode/UnityProject/UnityProject/Info.plist
          # all others: <build directory>/com.test.buildalon.xcode/Info.plist
          if [ "${EXPORT_OPTION}" != "app-store-connect" ]; then
            exit 0
          fi

          INFO_PLIST_PATH="${BUILD_DIRECTORY}/com.test.buildalon.xcode/UnityProject/UnityProject/Info.plist"

          if [ ! -f "${INFO_PLIST_PATH}" ]; then
            INFO_PLIST_PATH="${BUILD_DIRECTORY}/com.test.buildalon.xcode/Info.plist"
          fi

          # test path exists
          if [ ! -f "${INFO_PLIST_PATH}" ]; then
            echo "Info.plist not found at path: ${INFO_PLIST_PATH}"
            exit 1
          fi

          # make sure plist buddy is installed
          if ! command -v /usr/libexec/PlistBuddy &> /dev/null; then
            echo "PlistBuddy could not be found"
            exit 1
          fi

          # set ITSAppUsesNonExemptEncryption to false in Info.plist using PlistBuddy
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "${INFO_PLIST_PATH}"
      - uses: ./ # buildalon/unity-xcode-builder
        id: xcode-build
        with:
          xcode-version: ${{ matrix.xcode-version }}
          project-path: ${{ env.BUILD_DIRECTORY }}/**/*.xcodeproj
          app-store-connect-key: ${{ secrets.APP_STORE_CONNECT_KEY }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          export-option: ${{ env.EXPORT_OPTION }}
          notarize: ${{ env.EXPORT_OPTION != 'app-store-connect' }}
          archive-type: pkg
          test-groups: Beta
          developer-id-application-certificate: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT }}
          developer-id-application-certificate-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
          developer-id-installer-certificate: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT }}
          developer-id-installer-certificate-password: ${{ secrets.SIGNING_CERT_PASSWORD }}
      - name: Print outputs
        env:
          EXECUTABLE: ${{ steps.xcode-build.outputs.executable }}
          OUTPUT_DIRECTORY: ${{ steps.xcode-build.outputs.output-directory }}
        run: |
          set -euo pipefail

          if [ -z "${EXECUTABLE}" ]; then
            echo "No executable found in outputs"
            exit 1
          fi

          echo "Executable: ${EXECUTABLE}"

          if [ -z "${OUTPUT_DIRECTORY}" ]; then
            echo "No output directory found in outputs"
            exit 1
          fi

          echo "::group::Output Directory: ${OUTPUT_DIRECTORY}"
          ls -R "${OUTPUT_DIRECTORY}"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          retention-days: 1
          name: ${{ github.run_number }}.${{ github.run_attempt }} ${{ matrix.os }} ${{ matrix.xcode-version }} ${{ matrix.unity-version }} ${{ matrix.build-target }} Logs
          path: |
            ${{ github.workspace }}/**/*.log
